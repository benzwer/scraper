<!doctype html>
<html><body>
<!-- Synthetic page for the page analysis tests: two "save this search" popups -->
<div class="toolbar"><button class="toolbar__save">Save search</button></div>
<div role="dialog" class="save-dialog">
  <p>Save this search and get an alert for new listings</p>
  <button class="save-dialog__confirm">Save</button>
  <button class="save-dialog__close" aria-label="Close">×</button>
</div>
<div class="alert-modal" style="position: fixed; inset: 0">
  <p>Do you want to save the search?</p>
  <span class="alert-modal__x">✕</span>
</div>
</body></html>
